name: Release

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing opaline-cli@* tag to resume after a failed publish
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release_please:
    name: Release Please
    if: >-
      (
        github.event_name == 'workflow_dispatch' &&
        inputs.release_tag == ''
      ) ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      cli_release_created: ${{ steps.release.outputs['apps/cli--release_created'] }}
      cli_tag_name: ${{ steps.release.outputs['apps/cli--tag_name'] }}
      cli_sha: ${{ steps.release.outputs['apps/cli--sha'] }}
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - name: Checkout release PR for lockfile synchronization
        if: steps.release.outputs.prs_created == 'true' && steps.release.outputs.pr != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr || '{}').headBranchName }}
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - name: Setup Bun for release lockfile
        if: steps.release.outputs.prs_created == 'true' && steps.release.outputs.pr != ''
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10

      - name: Synchronize the release PR lockfile
        if: steps.release.outputs.prs_created == 'true' && steps.release.outputs.pr != ''
        env:
          RELEASE_PR_BRANCH: ${{ fromJSON(steps.release.outputs.pr || '{}').headBranchName }}
        run: |
          case "${RELEASE_PR_BRANCH}" in
            release-please--branches--main|release-please--branches--main--components--opaline-cli) ;;
            *) echo "Unexpected release PR branch: ${RELEASE_PR_BRANCH}"; exit 1 ;;
          esac
          bun install --lockfile-only --ignore-scripts
          # Bun 1.3.9 can retain old workspace versions (oven-sh/bun#18906).
          node <<'NODE'
          const fs = require("node:fs");
          let lockfile = fs.readFileSync("bun.lock", "utf8");
          for (const workspace of ["apps/cli", "packages/opaline", "packages/rudel-alias"]) {
            const manifest = JSON.parse(fs.readFileSync(`${workspace}/package.json`, "utf8"));
            const start = lockfile.indexOf(`    "${workspace}": {\n`);
            const end = lockfile.indexOf("\n    },", start) + "\n    },".length;
            if (start < 0 || end <= start) throw new Error(`Missing lockfile workspace: ${workspace}`);
            const original = lockfile.slice(start, end);
            let updated = original;
            const fields = { version: manifest.version };
            if (workspace !== "apps/cli") fields["@opalinehq/cli"] = manifest.dependencies["@opalinehq/cli"];
            for (const [field, version] of Object.entries(fields)) {
              const pattern = new RegExp(`("${field}": ")[^"]+("(?=,?\\n))`, "g");
              if ([...updated.matchAll(pattern)].length !== 1) throw new Error(`Unexpected ${field} in ${workspace}`);
              updated = updated.replace(pattern, (_, prefix, suffix) => `${prefix}${version}${suffix}`);
            }
            lockfile = lockfile.slice(0, start) + updated + lockfile.slice(end);
          }
          fs.writeFileSync("bun.lock", lockfile);
          NODE
          if ! git diff --quiet -- bun.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add bun.lock
            git commit -m "chore: synchronize CLI release lockfile"
            git push origin "HEAD:${RELEASE_PR_BRANCH}"
          fi

  publish:
    if: >-
      always() &&
      (
        (
          needs.release_please.outputs.cli_release_created == 'true'
        ) ||
        (
          github.event_name == 'workflow_dispatch' &&
          inputs.release_tag != ''
        )
      )
    needs: release_please
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout released commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.release_please.outputs.cli_sha || inputs.release_tag }}

      - name: Authorize release source
        env:
          CLI_RELEASE_SHA: ${{ needs.release_please.outputs.cli_sha }}
          CLI_RELEASE_TAG: ${{ needs.release_please.outputs.cli_tag_name || inputs.release_tag }}
        run: |
          package_version="$(node -p "require('./apps/cli/package.json').version")"
          expected_cli_tag="opaline-cli@${package_version}"

          test "${CLI_RELEASE_TAG}" = "${expected_cli_tag}"

          for package_dir in packages/opaline packages/rudel-alias; do
            alias_version="$(node -p "require('./${package_dir}/package.json').version")"
            alias_dependency="$(node -p "require('./${package_dir}/package.json').dependencies['@opalinehq/cli']")"
            test "${package_version}" = "${alias_version}"
            test "${package_version}" = "${alias_dependency}"
          done

          git fetch --force --no-tags origin main:refs/remotes/origin/main
          git fetch --force --no-tags origin \
            "refs/tags/${expected_cli_tag}:refs/tags/${expected_cli_tag}"

          checked_out_sha="$(git rev-parse HEAD)"
          cli_tag_sha="$(git rev-parse "refs/tags/${expected_cli_tag}^{commit}")"

          test "${checked_out_sha}" = "${cli_tag_sha}"
          if [[ -n "${CLI_RELEASE_SHA}" ]]; then
            test "${cli_tag_sha}" = "${CLI_RELEASE_SHA}"
          fi
          git merge-base --is-ancestor "${cli_tag_sha}" refs/remotes/origin/main

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Setup Bun
        uses: ./.github/actions/setup

      - name: Require existing npm package records
        run: |
          npm view @opalinehq/cli version >/dev/null
          npm view opaline version >/dev/null
          npm view rudel version >/dev/null

      - name: Verify
        run: bun run verify

      - name: Publish @opalinehq/cli with provenance
        working-directory: apps/cli
        env:
          OPALINE_BUILD_POSTHOG_KEY: ${{ vars.OPALINE_BUILD_POSTHOG_KEY }}
          OPALINE_BUILD_POSTHOG_HOST: ${{ vars.OPALINE_BUILD_POSTHOG_HOST }}
        run: |
          test -n "${OPALINE_BUILD_POSTHOG_KEY}"
          test -n "${OPALINE_BUILD_POSTHOG_HOST}"
          version="$(node -p "require('./package.json').version")"
          if npm view "@opalinehq/cli@${version}" version >/dev/null 2>&1; then
            echo "@opalinehq/cli@${version} is already published."
          else
            bun run build
            npm publish --ignore-scripts --access public --provenance --tag latest
          fi

      - name: Wait for @opalinehq/cli registry availability
        run: |
          version="$(node -p "require('./apps/cli/package.json').version")"
          for attempt in {1..150}; do
            if [[ "$(npm view "@opalinehq/cli@${version}" version 2>/dev/null)" == "${version}" ]]; then
              exit 0
            fi
            sleep 2
          done
          echo "@opalinehq/cli@${version} did not become available in time."
          exit 1

      - name: Publish opaline and rudel launchers with provenance
        shell: bash
        run: |
          for package_dir in packages/opaline packages/rudel-alias; do
            (
              cd "${package_dir}"
              name="$(node -p "require('./package.json').name")"
              version="$(node -p "require('./package.json').version")"
              if npm view "${name}@${version}" version >/dev/null 2>&1; then
                echo "${name}@${version} is already published."
              else
                npm publish --access public --provenance --tag latest
              fi
            )
          done
